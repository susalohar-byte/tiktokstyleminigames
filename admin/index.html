<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Games Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0F172A;
      color: #E2E8F0;
      line-height: 1.6;
    }

    #app {
      min-height: 100vh;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #1E293B;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .login-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      color: #94A3B8;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #0F172A;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #E2E8F0;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #8B5CF6;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #EF4444;
      color: #FCA5A5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #1E293B;
      padding: 24px;
      border-right: 1px solid #334155;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-brand {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 32px;
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-item:hover {
      background: rgba(139, 92, 246, 0.1);
    }

    .nav-item.active {
      background: rgba(139, 92, 246, 0.2);
      color: #8B5CF6;
    }

    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 36px;
      font-weight: 800;
    }

    .btn-primary {
      padding: 12px 24px;
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-logout {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #EF4444;
      border-radius: 8px;
      color: #EF4444;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .card {
      background: #1E293B;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 16px;
      background: #0F172A;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #334155;
    }

    tr:hover td {
      background: rgba(139, 92, 246, 0.05);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-published {
      background: rgba(34, 197, 94, 0.1);
      color: #4ADE80;
    }

    .badge-draft {
      background: rgba(251, 191, 36, 0.1);
      color: #FBBF24;
    }

    .thumbnail {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      padding: 8px;
      background: transparent;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: #8B5CF6;
      color: #8B5CF6;
    }

    .btn-danger:hover {
      border-color: #EF4444;
      color: #EF4444;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #1E293B;
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .btn-close:hover {
      background: rgba(148, 163, 184, 0.1);
    }

    .file-upload {
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .file-upload:hover {
      border-color: #8B5CF6;
      background: rgba(139, 92, 246, 0.05);
    }

    .file-upload.dragover {
      border-color: #8B5CF6;
      background: rgba(139, 92, 246, 0.1);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid #22C55E;
      color: #4ADE80;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      background: #0F172A;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #E2E8F0;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    select:focus {
      outline: none;
      border-color: #8B5CF6;
    }

    textarea {
      width: 100%;
      padding: 12px 16px;
      background: #0F172A;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #E2E8F0;
      font-size: 16px;
      transition: border-color 0.2s;
      min-height: 100px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #8B5CF6;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(6, 182, 212, 0.1));
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px;
    }

    .stat-label {
      font-size: 14px;
      color: #94A3B8;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      color: #E2E8F0;
    }

    .btn-toggle {
      flex: 1;
      padding: 12px 20px;
      background: #0F172A;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #94A3B8;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-toggle:hover {
      border-color: #8B5CF6;
      color: #8B5CF6;
    }

    .btn-toggle.active {
      background: linear-gradient(135deg, #8B5CF6, #06B6D4);
      border-color: transparent;
      color: white;
    }

    .upload-area {
      background: #0F172A;
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-area:hover {
      border-color: #8B5CF6;
      background: rgba(139, 92, 246, 0.05);
    }

    .badge-archived {
      background: rgba(148, 163, 184, 0.1);
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
